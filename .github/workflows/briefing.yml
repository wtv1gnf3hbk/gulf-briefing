# Generate Gulf Briefing — manual-only since 2026-04-20 refactor.
# The live site is now the Wire (index.html → feed.json); this workflow
# produces the legacy conversational / bullets / WIB formats on demand.
# See plan file: harmonic-leaping-trinket.md

name: Generate Gulf Briefing

on:
  # Manual trigger only — no cron.
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the feed.yml workflow via a repo-wide write group.
# Prevents race conditions where both try to push to main simultaneously.
concurrency:
  group: write-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Scrape news sources
        run: node generate-briefing.js

      - name: Write all three styles
        # write-briefing.js produces briefing.md + briefing.html each run.
        # index.html is the live Wire — intentionally never touched here.
        # add-nav.js is deprecated (it linked the three briefing pages together;
        # no longer wired up from the live Wire) and is skipped.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node write-briefing.js
          cp briefing.md conversational.md
          cp briefing.html conversational.html
          node write-briefing.js --style=bullets
          mv briefing.md bullets.md
          mv briefing.html bullets.html
          node write-briefing.js --style=wib
          mv briefing.md wib.md
          mv briefing.html wib.html

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Fetch latest remote state before committing.
          # Prevents "fetch first" rejections when feed.yml pushes mid-run.
          # Safe because all our outputs are full-file replacements (idempotent).
          git fetch origin main
          git reset --soft origin/main

          # NOTE: index.html is the live Wire — do NOT re-commit it from here.
          # Briefing outputs live in conversational.* / bullets.* / wib.* only.
          # screenshots/ intentionally omitted (Vivian: not useful).
          git add briefing.json conversational.md conversational.html bullets.md bullets.html wib.md wib.html
          git diff --staged --quiet || {
            git commit -m "Update Gulf briefing $(TZ=Asia/Dubai date +%Y-%m-%d)"
            git push origin main
          }
