name: Scrape Twitter

# Playwright-based Twitter scraper for the live Wire. Tweets merge into
# feed.json using URL-based dedup, same as RSS items.
#
# CADENCE: hourly, as a deliberate workaround for the Cloudflare bot challenge
# x.com serves to some GitHub Actions runner IPs (diagnosed 2026-09-08; see
# lib/scrape-twitter.js detectBotChallenge). Roughly 1 in 3 runner IPs is clean,
# and the block is IP reputation — not the X session cookies, and not the
# browser fingerprint (both ruled out by measurement). So the only lever
# available without new infrastructure is more attempts: ~8 good pulls a day
# instead of the ~1 that a 3-hourly cadence was yielding.
#
# This is only affordable because the scraper now aborts after 5 consecutive
# challenged handles: a blocked run costs ~2.5 min instead of grinding all 45
# handles for ~7 min. Do NOT raise the cadence without that abort in place.
# Actions minutes are free here (public repo).
#
# See: generate-briefing.js --twitter-only mode, plan harmonic-leaping-trinket.md

# CAVEAT on the cadence: GH Actions free-tier cron is throttled and unreliable
# here — feed.yml gave up on it entirely and is now dispatched every 15 min by
# the gulf-briefing-refresh Cloudflare worker, because Actions cron was
# stretching to 3-4hr gaps. So 'hourly' below is a ceiling, not a guarantee.
# If the observed rate stays near 3-hourly, the next step is to add a
# twitter.yml dispatch to that same worker rather than fighting Actions cron.
#
# Shares the write-main concurrency group with feed.yml (cancel-in-progress:
# false), so an hourly Twitter run can delay a feed run by at most one
# scrape — ~2.5 min when challenged, and nothing is ever cancelled.

on:
  schedule:
    # Hourly, offset 15 min so it doesn't collide with feed.yml (:00).
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Share the write-main concurrency group with feed.yml + briefing.yml so only
# one workflow pushes to origin/main at a time.
concurrency:
  group: write-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Scrape tweets into feed.json
        env:
          # Logged-in X session cookies (Option B). Without these, X serves a
          # login wall and every handle returns 0 tweets. Set via:
          #   gh secret set X_AUTH_TOKEN --repo wtv1gnf3hbk/gulf-briefing
          #   gh secret set X_CT0        --repo wtv1gnf3hbk/gulf-briefing
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: node generate-briefing.js --twitter-only

      - name: Commit feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Rebase onto latest remote before committing (feed.json is a full replacement)
          git fetch origin main
          git reset --soft origin/main

          git add feed.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update tweets $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
