name: Scrape Feed

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize with briefing.yml via a repo-wide write group.
# Prevents race conditions where both try to push to main simultaneously.
concurrency:
  group: write-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape RSS feeds
        run: node scrape-feed.js

      - name: Commit feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Rebase onto latest remote before committing (feed.json is a full replacement)
          git fetch origin main
          git reset --soft origin/main

          git add feed.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update feed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
