<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gulf Wire</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #d4d4d4;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #e5a100;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .header .meta {
      font-size: 11px;
      color: #666;
    }

    .header .meta .live {
      color: #22c55e;
      font-weight: 600;
    }

    /* Nav bar linking back to briefing */
    .nav {
      padding: 6px 20px;
      border-bottom: 1px solid #1a1a1a;
      font-size: 11px;
      display: flex;
      gap: 16px;
    }

    .nav a {
      color: #666;
      text-decoration: none;
    }

    .nav a:hover { color: #999; }
    .nav a.active { color: #e5a100; font-weight: 600; }

    /* Controls bar */
    .controls {
      padding: 10px 20px;
      border-bottom: 1px solid #222;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chip {
      padding: 3px 10px;
      border: 1px solid #333;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
      background: transparent;
      color: #888;
      font-family: inherit;
      transition: all 0.15s;
    }

    .chip:hover { border-color: #555; color: #bbb; }
    .chip.active { border-color: #e5a100; color: #e5a100; background: #1a1500; }

    .separator {
      width: 1px;
      height: 20px;
      background: #333;
      margin: 0 4px;
    }

    .keyword-input {
      background: #111;
      border: 1px solid #333;
      border-radius: 3px;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 11px;
      padding: 3px 10px;
      width: 180px;
      outline: none;
    }

    .keyword-input:focus { border-color: #e5a100; }
    .keyword-input::placeholder { color: #555; }

    /* Feed items */
    .feed {
      padding: 0;
    }

    .time-group {
      padding: 6px 20px;
      font-size: 10px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #1a1a1a;
      background: #0d0d0d;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .item {
      padding: 5px 20px;
      border-bottom: 1px solid #111;
      display: flex;
      align-items: baseline;
      gap: 10px;
      transition: background 0.1s;
    }

    .item:hover { background: #111; }

    .item .time {
      color: #555;
      font-size: 11px;
      min-width: 48px;
      flex-shrink: 0;
    }

    .item .country-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 2px;
      font-weight: 600;
      min-width: 28px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Country color coding */
    .country-saudi { background: #1a2800; color: #6fbf00; }
    .country-uae { background: #1a0028; color: #bf6fff; }
    .country-qatar { background: #002828; color: #00bfbf; }
    .country-kuwait { background: #281a00; color: #bf8f00; }
    .country-bahrain { background: #280000; color: #bf4040; }
    .country-oman { background: #001a28; color: #4090bf; }
    .country-yemen { background: #281400; color: #bf7030; }
    .country-wire { background: #1a1a1a; color: #888; }
    .country-regional { background: #1a1a00; color: #8f8f00; }
    .country-other { background: #1a1a1a; color: #666; }

    .item .source-tag {
      color: #666;
      font-size: 11px;
      min-width: 100px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item .headline {
      color: #d4d4d4;
      flex: 1;
    }

    .item .headline a {
      color: inherit;
      text-decoration: none;
    }

    .item .headline a:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* Keyword highlight */
    .highlight {
      background: #665500;
      color: #ffdd00;
      padding: 0 2px;
      border-radius: 1px;
    }

    /* Arabic original tooltip */
    .item .headline[title] {
      cursor: help;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #555;
    }

    .stats-bar {
      padding: 6px 20px;
      font-size: 10px;
      color: #444;
      border-top: 1px solid #1a1a1a;
      display: flex;
      gap: 16px;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .item .source-tag { display: none; }
      .item .time { min-width: 40px; font-size: 10px; }
      .keyword-input { width: 120px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Gulf Wire</h1>
    <div class="meta">
      <span class="live">LIVE</span>
      &middot; Updated <span id="updated">--</span>
      &middot; <span id="item-count">0</span> items
    </div>
  </div>

  <div class="controls">
    <button class="chip active" data-country="all">All</button>
    <button class="chip" data-country="Saudi Arabia">SA</button>
    <button class="chip" data-country="UAE">UAE</button>
    <button class="chip" data-country="Qatar">QA</button>
    <button class="chip" data-country="Kuwait">KW</button>
    <button class="chip" data-country="Bahrain">BH</button>
    <button class="chip" data-country="Oman">OM</button>
    <button class="chip" data-country="Yemen">YE</button>
    <div class="separator"></div>
    <button class="chip" data-country="Wire">Wire</button>
    <button class="chip" data-country="Regional">Regional</button>
    <div class="separator"></div>
    <button class="chip active" data-type="all">All sources</button>
    <button class="chip" data-type="news">News</button>
    <button class="chip" data-type="twitter">X</button>
    <div class="separator"></div>
    <button class="chip" data-state="only" title="Only state news agencies + official ministry accounts">State only</button>
    <div class="separator"></div>
    <input type="text" class="keyword-input" id="keyword" placeholder="Keyword highlight...">
  </div>

  <div class="feed" id="feed"></div>
  <div class="stats-bar" id="stats"></div>

<script>
  // ============================================
  // STATE
  // ============================================

  let feedData = null;
  let activeCountry = 'all';
  let activeType = 'all';   // 'all' | 'news' | 'twitter'
  let activeState = false;  // when true, restrict to state news agencies + official ministry/gov accounts
  let keyword = '';

  // Sources considered "state" — official press agencies and government / ministry
  // channels. Excludes individual royals/ministers, state-funded-but-editorial
  // outlets (Al Jazeera, Al Arabiya), and gray-area partnerships (Asharq News).
  // Edit this list to tune the filter.
  const STATE_SOURCE_IDS = new Set([
    // Official press agencies (most are screenshot-only today; added for forward
    // compatibility if RSS feeds get wired in).
    'saudi_press_agency', 'wam', 'qatar_news_agency', 'bahrain_news_agency',
    'kuna', 'oman_news_agency', 'saba_aden', 'saba_houthi',
    'uae_mofa', 'alekhbariya',
    // Ministry / government Twitter accounts
    'twitter_ksamofa',            // Saudi MFA
    'twitter_moi_saudi',          // Saudi Interior
    'twitter_saudi_civil_defense',
    'twitter_alekhbariya',        // Saudi state TV
    'twitter_uae_media',          // UAE Gov Media Office
    'twitter_mod_uae',            // UAE Defense
    'twitter_moi_uae',            // UAE Interior
    'twitter_dxb_media',          // Dubai Media Office
    'twitter_ad_media',           // Abu Dhabi Media Office
    'twitter_pm_qatar',
    'twitter_gco_qatar',          // Qatar Gov Comms Office
    'twitter_bahrain_mfa',
    'twitter_bahrain_moi',
  ]);

  // ============================================
  // FETCH + RENDER
  // ============================================

  async function loadFeed() {
    try {
      const res = await window.fetch('feed.json?t=' + Date.now());
      if (!res.ok) throw new Error('Feed not found');
      feedData = await res.json();
      document.getElementById('updated').textContent = timeAgo(new Date(feedData.updated));
      document.getElementById('item-count').textContent = feedData.items.length;
      render();
    } catch (e) {
      document.getElementById('feed').innerHTML =
        '<div class="empty-state">No feed data yet. Run <code>node scrape-feed.js</code> to generate.</div>';
    }
  }

  function render() {
    if (!feedData || !feedData.items) return;

    // Filter by country + source type (news vs twitter) + state toggle.
    // All three filters AND together so e.g. "SA + X + State only" narrows to
    // Saudi ministry/royal tweets.
    let items = feedData.items;
    if (activeCountry !== 'all') {
      items = items.filter(i => i.country === activeCountry);
    }
    if (activeType === 'twitter') {
      items = items.filter(i => (i.category || '').includes('twitter'));
    } else if (activeType === 'news') {
      items = items.filter(i => !(i.category || '').includes('twitter'));
    }
    if (activeState) {
      items = items.filter(i => STATE_SOURCE_IDS.has(i.sourceId));
    }

    // Group by time bucket
    const now = Date.now();
    const ONE_HOUR = 3600000;
    const SIX_HOURS = 6 * ONE_HOUR;

    const groups = [
      { label: 'Last hour', items: [] },
      { label: 'Last 6 hours', items: [] },
      { label: 'Earlier', items: [] }
    ];

    for (const item of items) {
      const age = now - new Date(item.date).getTime();
      if (age < ONE_HOUR) groups[0].items.push(item);
      else if (age < SIX_HOURS) groups[1].items.push(item);
      else groups[2].items.push(item);
    }

    let html = '';
    for (const group of groups) {
      if (group.items.length === 0) continue;
      html += `<div class="time-group">${group.label} (${group.items.length})</div>`;
      for (const item of group.items) {
        html += renderItem(item);
      }
    }

    if (html === '') {
      html = '<div class="empty-state">No items match your filters.</div>';
    }

    document.getElementById('feed').innerHTML = html;

    // Stats
    const countries = {};
    for (const item of feedData.items) {
      countries[item.country] = (countries[item.country] || 0) + 1;
    }
    const statsText = Object.entries(countries)
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `${k}: ${v}`)
      .join('  |  ');
    document.getElementById('stats').textContent = statsText;
  }

  function renderItem(item) {
    const d = new Date(item.date);
    const time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

    const countryClass = 'country-' + (item.country || 'other').toLowerCase().replace(/\s+/g, '-');
    const countryLabel = item.country || '?';

    // Keyword highlighting
    let headline = escapeHtml(item.headline);
    if (keyword) {
      const re = new RegExp('(' + escapeRegex(keyword) + ')', 'gi');
      headline = headline.replace(re, '<span class="highlight">$1</span>');
    }

    // Title attribute shows original Arabic if translated
    const titleAttr = item.originalHeadline ? ` title="${escapeAttr(item.originalHeadline)}"` : '';

    // Mark Twitter items with a small "𝕏" prefix so readers can tell at a glance.
    const isTwitter = (item.category || '').includes('twitter');
    const sourcePrefix = isTwitter ? '𝕏 ' : '';

    return `<div class="item">
      <span class="time">${time}</span>
      <span class="country-badge ${countryClass}">${escapeHtml(countryLabel)}</span>
      <span class="source-tag">${sourcePrefix}${escapeHtml(item.source)}</span>
      <span class="headline"${titleAttr}><a href="${escapeAttr(item.url)}" target="_blank" rel="noopener">${headline}</a></span>
    </div>`;
  }

  // ============================================
  // UTILS
  // ============================================

  function timeAgo(date) {
    const secs = Math.floor((Date.now() - date.getTime()) / 1000);
    if (secs < 60) return 'just now';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
    return Math.floor(secs / 86400) + 'd ago';
  }

  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escapeAttr(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escapeRegex(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // ============================================
  // EVENT HANDLERS
  // ============================================

  // Country filter chips
  document.querySelectorAll('.chip[data-country]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-country]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCountry = chip.dataset.country;
      render();
    });
  });

  // Source-type filter chips (All / News / X)
  document.querySelectorAll('.chip[data-type]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-type]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeType = chip.dataset.type;
      render();
    });
  });

  // State-only toggle chip — independent of the others; ANDs with existing filters.
  document.querySelectorAll('.chip[data-state]').forEach(chip => {
    chip.addEventListener('click', () => {
      activeState = !activeState;
      chip.classList.toggle('active', activeState);
      render();
    });
  });

  // Keyword highlight
  document.getElementById('keyword').addEventListener('input', (e) => {
    keyword = e.target.value.trim();
    render();
  });

  // ============================================
  // INIT + AUTO-REFRESH
  // ============================================

  loadFeed();
  setInterval(loadFeed, 60000); // Refresh every 60s
</script>

</body>
</html>
