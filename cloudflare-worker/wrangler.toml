name = "gulf-briefing-refresh"
main = "worker.js"
compatibility_date = "2024-01-01"

# Cron triggers — GH Actions cron is unreliable (observed 3-4hr gaps on a
# */15 schedule). Cloudflare cron fires reliably. Routed by event.cron in
# worker.js scheduled handler. Requires Workers Paid plan.
#
# feed.yml dropped from */15 to */30 on 2026-08-06: each dispatch still bills
# GH Actions minutes same as a native cron trigger would (workflow_dispatch
# isn't free) — at */15 this one repo was ~43% of the account's monthly
# Actions spend and its dispatch volume was contributing to runner-acquisition
# failures on other repos' scheduled jobs (observed colliding with dach-digest
# failures same day). */30 halves both the minute burn and the dispatch rate.
[triggers]
crons = [
  "*/30 * * * *",   # feed.yml — raw scrape every 30 min (was */15)
  "0 * * * *"       # briefing.yml — curated digest regen hourly
]
